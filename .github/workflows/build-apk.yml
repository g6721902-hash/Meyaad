
name: Build Meyaad APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Meyaad project
        run: |
          set -e
          mkdir -p /tmp/meyaad
          if [ -f meyaad_app_v1_fixed.zip ]; then
            unzip -o meyaad_app_v1_fixed.zip -d /tmp/meyaad
          elif [ -f meyaad_app_v1.zip ]; then
            unzip -o meyaad_app_v1.zip -d /tmp/meyaad
          else
            echo "ERROR: Meyaad project ZIP not found"
            exit 1
          fi
          cp -a /tmp/meyaad/. .
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/screens/search_screen.dart

      - name: Generate Android project
        run: flutter create --platforms=android --project-name=meyaad .

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meyaad-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
